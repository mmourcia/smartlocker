<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Arial, Helvetica, sans-serif">
  <title>Architecture Smart Locker</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: bold; fill: #111; text-anchor: middle; }
      .s  { font-size: 12px; fill: #333; text-anchor: middle; }
      .l  { font-size: 11px; fill: #333; }
      .lc { font-size: 11px; fill: #333; text-anchor: middle; }
      .layer { font-size: 12px; font-weight: bold; letter-spacing: 0.5px; }
      .ln { stroke: #333; stroke-width: 1.4; fill: none; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Bandes de couches -->
  <rect x="10" y="10"  width="940" height="120" rx="8" fill="#eef4fc"/>
  <rect x="10" y="150" width="940" height="140" rx="8" fill="#eef8ee"/>
  <rect x="10" y="310" width="940" height="150" rx="8" fill="#fdf8e6"/>
  <rect x="10" y="480" width="940" height="110" rx="8" fill="#f3f0f8"/>
  <text x="24" y="30"  class="layer" fill="#2f5d9e">LOGICIEL</text>
  <text x="24" y="170" class="layer" fill="#3d7d3d">ESP32 · WI-FI</text>
  <text x="24" y="330" class="layer" fill="#9a7a10">MATÉRIEL (MEUBLE)</text>
  <text x="24" y="500" class="layer" fill="#6a4f9a">ALIMENTATION</text>

  <!-- Logiciel -->
  <rect x="300" y="38" width="360" height="80" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="480" y="62" class="t">Mini PC · Home Assistant OS</text>
  <text x="480" y="82" class="s">composant smart_locker (casiers, PIN, badges,</text>
  <text x="480" y="98" class="s">messages, éclairage) + cartes Lovelace</text>

  <rect x="740" y="48" width="190" height="60" rx="8" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="835" y="72" class="t">Destinataires</text>
  <text x="835" y="92" class="s">email · SMS · app mobile</text>
  <line x1="660" y1="78" x2="738" y2="78" class="ln" marker-end="url(#a)"/>
  <text x="699" y="70" class="lc">notify.*</text>

  <!-- ESP32 -->
  <rect x="40"  y="190" width="250" height="80" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="165" y="216" class="t">Carte relais ESP32</text>
  <text x="165" y="236" class="s">LC-Relay-ESP32-8R-D5 (ESPHome)</text>
  <text x="165" y="254" class="s">7 relais · 7 entrées reed</text>

  <rect x="355" y="190" width="250" height="80" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="480" y="216" class="t">Digicode ESP32</text>
  <text x="480" y="236" class="s">ESPHome · Wiegand 26</text>
  <text x="480" y="254" class="s">touches, PIN, badges</text>

  <rect x="670" y="190" width="250" height="80" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="795" y="216" class="t">Contrôleur LED</text>
  <text x="795" y="236" class="s">Gledopto GL-C-017WL-D (WLED)</text>
  <text x="795" y="254" class="s">8 segments, un par case</text>

  <!-- Liaisons Wi-Fi -->
  <path d="M300,98 L140,98 L140,188" class="ln" marker-end="url(#a)"/>
  <text x="132" y="140" class="l" text-anchor="end">ouverture</text>
  <text x="132" y="154" class="l" text-anchor="end">(button.press)</text>
  <path d="M195,188 L195,118 L298,118" class="ln dash" marker-end="url(#a)"/>
  <text x="203" y="140" class="l">état des portes</text>

  <line x1="480" y1="188" x2="480" y2="120" class="ln" marker-end="url(#a)"/>
  <text x="488" y="150" class="l">événements : touche,</text>
  <text x="488" y="164" class="l">code, badge, timeout</text>

  <path d="M660,98 L795,98 L795,188" class="ln" marker-end="url(#a)"/>
  <text x="803" y="140" class="l">état des segments</text>
  <text x="803" y="154" class="l">(API JSON WLED)</text>

  <!-- Matériel -->
  <rect x="30"  y="350" width="125" height="70" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="92"  y="378" class="t">Serrures ×7</text>
  <text x="92"  y="398" class="s">solénoïdes 12V</text>

  <rect x="170" y="350" width="125" height="70" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="232" y="378" class="t">Reed ×7</text>
  <text x="232" y="398" class="s">état des portes</text>

  <rect x="355" y="350" width="250" height="70" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="480" y="378" class="t">Clavier RFID ReaIOKbii S20</text>
  <text x="480" y="398" class="s">code PIN · badges EM4100 125 kHz</text>

  <rect x="670" y="350" width="250" height="70" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="795" y="378" class="t">Rubans LED COB ×2</text>
  <text x="795" y="398" class="s">WS2811 12V · 53 pixels</text>

  <!-- Liaisons filaires -->
  <line x1="92" y1="272" x2="92" y2="348" class="ln" marker-end="url(#a)"/>
  <text x="100" y="290" class="l">impulsion</text>
  <text x="100" y="304" class="l">12V 400 ms</text>
  <line x1="232" y1="348" x2="232" y2="272" class="ln" marker-end="url(#a)"/>
  <text x="240" y="314" class="l">GPIO</text>
  <line x1="480" y1="348" x2="480" y2="272" class="ln" marker-end="url(#a)"/>
  <text x="488" y="314" class="l">D0 / D1 (Wiegand)</text>
  <line x1="795" y1="272" x2="795" y2="348" class="ln" marker-end="url(#a)"/>
  <text x="803" y="306" class="l">DATA ruban 1 / 2</text>
  <text x="803" y="320" class="l">(GPIO16 / GPIO4)</text>

  <text x="480" y="448" class="lc">Case 3 du Kallax : compartiment technique (électronique, alimentation) · 7 casiers utiles</text>

  <!-- Alimentation -->
  <rect x="40" y="510" width="555" height="66" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="317" y="536" class="t">Mean Well XDR-240-12 · 12V 20A</text>
  <text x="317" y="556" class="s">serrures (via relais), carte relais, clavier, contrôleur LED et rubans</text>

  <rect x="670" y="510" width="250" height="66" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="795" y="536" class="t">Convertisseur 12V → 5V</text>
  <text x="795" y="556" class="s">ESP32 du digicode</text>
  <line x1="597" y1="543" x2="668" y2="543" class="ln" marker-end="url(#a)"/>
  <text x="632" y="535" class="lc">12V</text>
</svg>
