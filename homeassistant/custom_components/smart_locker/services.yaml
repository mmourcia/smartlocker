assign:
  name: Assigner un casier
  description: Assigne un destinataire au casier, génère le PIN si besoin et passe le casier en état occupé.
  fields:
    locker_id:
      name: Numéro du casier
      description: Numéro du casier (1, 2, 4 à 8 — le 3 est le compartiment technique)
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
    recipient_id:
      name: Identifiant du destinataire
      description: Identifiant interne (stable même si le destinataire est renommé). Utilisé par les cartes.
      required: false
      selector:
        text:
    user:
      name: Destinataire (nom)
      description: Alternative à recipient_id - « Prénom Nom » tel que saisi dans la carte Destinataires
      required: false
      selector:
        text:

unassign:
  name: Retirer un assigné
  description: Retire un utilisateur de la liste des assignés du casier. Si la liste devient vide, le casier repasse en libre.
  fields:
    locker_id:
      name: Numéro du casier
      description: Numéro du casier (1, 2, 4 à 8 — le 3 est le compartiment technique)
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
    recipient_id:
      name: Identifiant du destinataire
      description: Identifiant interne du destinataire à retirer
      required: false
      selector:
        text:
    user:
      name: Destinataire (nom)
      description: Alternative à recipient_id - « Prénom Nom » du destinataire à retirer
      required: false
      selector:
        text:

open:
  name: Ouvrir un casier
  description: Déclenche l'impulsion relais (dépôt, vérification). Ne change pas l'état du casier.
  fields:
    locker_id:
      name: Numéro du casier
      description: Numéro du casier (1, 2, 4 à 8 — le 3 est le compartiment technique)
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box

notify:
  name: Notifier l'utilisateur
  description: Envoie le code PIN aux destinataires assignés via leurs services de notification (email, SMS, app mobile).
  fields:
    locker_id:
      name: Numéro du casier
      description: Numéro du casier (1, 2, 4 à 8 — le 3 est le compartiment technique)
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box

reset:
  name: Libérer un casier
  description: Remet le casier en état libre et efface l'utilisateur assigné.
  fields:
    locker_id:
      name: Numéro du casier
      description: Numéro du casier (1, 2, 4 à 8 — le 3 est le compartiment technique)
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box

set_out_of_service:
  name: Hors service
  description: Met un casier hors service (rouge fixe, PIN et badge inopérants, assignation et notification refusées) ou le remet en service. Le contenu du casier est conservé.
  fields:
    locker_id:
      name: Numéro du casier
      description: Numéro du casier (1, 2, 4 à 8 — le 3 est le compartiment technique)
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
    out_of_service:
      name: Hors service
      description: true pour mettre hors service, false pour remettre en service
      required: true
      selector:
        boolean:
