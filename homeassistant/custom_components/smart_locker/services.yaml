assign:
  name: Assigner un casier
  description: Assigne un destinataire au casier, génère le PIN si besoin et passe le casier en état occupé.
  fields:
    locker_id:
      name: Numéro du casier
      description: Numéro du casier (1, 2, 4 à 8 — le 3 est le compartiment technique)
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
    user:
      name: Utilisateur
      description: Destinataire au format « Prénom Nom » (tel que saisi dans la carte Destinataires)
      required: true
      selector:
        text:

unassign:
  name: Retirer un assigné
  description: Retire un utilisateur de la liste des assignés du casier. Si la liste devient vide, le casier repasse en libre.
  fields:
    locker_id:
      name: Numéro du casier
      description: Numéro du casier (1, 2, 4 à 8 — le 3 est le compartiment technique)
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
    user:
      name: Utilisateur
      description: Nom de l'utilisateur à retirer
      required: true
      selector:
        text:

open:
  name: Ouvrir un casier
  description: Déclenche l'impulsion relais pour ouvrir la serrure du casier.
  fields:
    locker_id:
      name: Numéro du casier
      description: Numéro du casier (1, 2, 4 à 8 — le 3 est le compartiment technique)
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box

notify:
  name: Notifier l'utilisateur
  description: Envoie le code PIN aux destinataires assignés via leurs services de notification (email, SMS, app mobile).
  fields:
    locker_id:
      name: Numéro du casier
      description: Numéro du casier (1, 2, 4 à 8 — le 3 est le compartiment technique)
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box

reset:
  name: Libérer un casier
  description: Remet le casier en état libre et efface l'utilisateur assigné.
  fields:
    locker_id:
      name: Numéro du casier
      description: Numéro du casier (1, 2, 4 à 8 — le 3 est le compartiment technique)
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
