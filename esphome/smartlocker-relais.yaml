# smartlocker-relais.yaml
substitutions:
  device_name: smartlocker-relais
  friendly_name: "Smart Locker - Relais"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
api:
  encryption:
    key: !secret smartlocker_relais_api_key

# Mise à jour du firmware à distance (OTA)
ota:
  - platform: esphome
    password: !secret smartlocker_relais__ota_password
    
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret smartlocker_relais_fallback_password
    
  use_address: 192.168.0.15
#  use_address: 192.168.0.59
# Relais
# Casier 3 = compartiment technique : pas de serrure, relais 3 (GPIO25) non utilise.

switch:
  - platform: gpio
    name: "Relais casier 1"
    id: relay_1
    pin: GPIO32
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relais casier 2"
    id: relay_2
    pin: GPIO33
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relais casier 4"
    id: relay_4
    pin: GPIO26
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relais casier 5"
    id: relay_5
    pin: GPIO27
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relais casier 6"
    id: relay_6
    pin: GPIO14
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relais casier 7"
    id: relay_7
    pin: GPIO12
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relais casier 8"
    id: relay_8
    pin: GPIO13
    restore_mode: ALWAYS_OFF

# Boutons virtuels - impulsion 400 ms
# Utilises par Home Assistant pour declencher l'ouverture d'un casier

button:
  - platform: template
    name: "Ouvrir casier 1"
    on_press:
      - switch.turn_on: relay_1
      - delay: 400ms
      - switch.turn_off: relay_1

  - platform: template
    name: "Ouvrir casier 2"
    on_press:
      - switch.turn_on: relay_2
      - delay: 400ms
      - switch.turn_off: relay_2

  - platform: template
    name: "Ouvrir casier 4"
    on_press:
      - switch.turn_on: relay_4
      - delay: 400ms
      - switch.turn_off: relay_4

  - platform: template
    name: "Ouvrir casier 5"
    on_press:
      - switch.turn_on: relay_5
      - delay: 400ms
      - switch.turn_off: relay_5

  - platform: template
    name: "Ouvrir casier 6"
    on_press:
      - switch.turn_on: relay_6
      - delay: 400ms
      - switch.turn_off: relay_6

  - platform: template
    name: "Ouvrir casier 7"
    on_press:
      - switch.turn_on: relay_7
      - delay: 400ms
      - switch.turn_off: relay_7

  - platform: template
    name: "Ouvrir casier 8"
    on_press:
      - switch.turn_on: relay_8
      - delay: 400ms
      - switch.turn_off: relay_8

# Reed switches
# 7 entrees sur GPIO sans contrainte (pas de strapping, pull-up interne).
# Pas de reed sur le casier 3 (compartiment technique).
# Cablage : reed entre le GPIO et GND, aucune resistance externe.
# Reed ferme (porte fermee) = niveau bas = "ferme" dans Home Assistant.
# Si l'etat est inverse, ajouter "inverted: true" sous "pin:".

binary_sensor:
  - platform: gpio
    name: "Porte casier 1"
    id: door_1
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
    device_class: door
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: gpio
    name: "Porte casier 2"
    id: door_2
    pin:
      number: GPIO16
      mode: INPUT_PULLUP
    device_class: door
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: gpio
    name: "Porte casier 4"
    id: door_4
    pin:
      number: GPIO17
      mode: INPUT_PULLUP
    device_class: door
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: gpio
    name: "Porte casier 5"
    id: door_5
    pin:
      number: GPIO18
      mode: INPUT_PULLUP
    device_class: door
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: gpio
    name: "Porte casier 6"
    id: door_6
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
    device_class: door
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: gpio
    name: "Porte casier 7"
    id: door_7
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
    device_class: door
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: gpio
    name: "Porte casier 8"
    id: door_8
    pin:
      number: GPIO22
      mode: INPUT_PULLUP
    device_class: door
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms